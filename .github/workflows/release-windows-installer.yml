name: Build Windows EXE and Installer

on:
  push:
    tags: ["v0.1.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Rust release
        run: cargo build --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ScreenTimeRS-v0.1.0.iss
      - name: Rename/copy EXE
        shell: pwsh
        run: Copy-Item target\x86_64-pc-windows-msvc\release\screentime-rs.exe dist\ScreenTimeRS-v0.1.0.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeRS-v0.1.0-Windows-x64
          path: |
            dist/ScreenTimeRS-v0.1.0.exe
            dist/ScreenTimeRS-v0.1.0-Setup.exe
