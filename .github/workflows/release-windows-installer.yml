name: Build Windows EXE and Installer

on:
  push:
    tags: ["v0.3.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Build Rust collector
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Publish WinUI 3 application
        run: dotnet publish ui/ScreenTimeRS.UI.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o dist/ui
      - name: Copy Rust collector
        shell: pwsh
        run: Copy-Item target/x86_64-pc-windows-msvc/release/screentime-rs.exe dist/ui/screentime-rs.exe -Force
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ScreenTimeRS-v0.3.0.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeRS-v0.3.0-Windows-x64
          path: |
            dist/ui/
            installer-output/ScreenTimeRS-v0.3.0-Setup.exe
